version: '3.8'

# Docker Compose configuration for Subspace Farmerless Dev Node
# This setup provides an easy way to run a local development node without a farmer
# Usage: docker-compose up

services:
  farmerless-dev-node:
    image: rust:latest
    container_name: subspace-farmerless-dev-node
    working_dir: /workspace
    volumes:
      # Mount the workspace to build and run the node
      - .:/workspace
      # Cache cargo registry to speed up subsequent builds
      - cargo-cache:/usr/local/cargo/registry
      # Cache target directory to speed up subsequent builds
      - target-cache:/workspace/target
    ports:
      - "9944:9944"  # Consensus RPC (HTTP/WebSocket)
      - "9945:9945"  # Domain RPC (HTTP/WebSocket)
      - "8545:8545"  # EVM RPC (HTTP/WebSocket)
    command: >
      bash -c "
        cargo build -p subspace-farmerless-dev-node --release &&
        cargo run -p subspace-farmerless-dev-node --release -- 
        --domain 
        --rpc-host 0.0.0.0 
        --domain-rpc-host 0.0.0.0
      "
    environment:
      # Set Rust log level (options: error, warn, info, debug, trace)
      - RUST_LOG=${RUST_LOG:-info}
      # Optional: Set block interval in milliseconds (default: 6000)
      # Set to 0 for manual block production
      - BLOCK_INTERVAL_MS=${BLOCK_INTERVAL_MS:-6000}
    networks:
      - subspace-dev
    # Restart policy: restart the container if it stops
    restart: unless-stopped

volumes:
  # Persistent volume for cargo registry cache
  cargo-cache:
  # Persistent volume for Rust build artifacts
  target-cache:

networks:
  # Isolated network for the dev node
  subspace-dev:
    driver: bridge

